<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construction Document Portal</title>
<meta name="description" content="Contractor-wise construction photo &amp; document management portal.">
<meta name="theme-color" content="#0F2C4C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  // Theme পেইন্টের আগেই বসিয়ে দেওয়া হয় — যাতে dark mode-এ পেজ রিলোডে এক মুহূর্তের
  // জন্যও light background flash না করে। utils.js-এর Theme অবজেক্ট পরে এটাই re-apply করে।
  (function () {
    try {
      var t = localStorage.getItem('cdp_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* localStorage অনুপলব্ধ হলে default light-ই থাকবে */ }
  })();
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="shell"><div class="loading"><div class="spinner"></div><p>Loading...</p></div></div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
